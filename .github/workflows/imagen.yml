# Construye la imagen del servidor (evaluador real) y la publica en ghcr.io.
# El VPS solo la descarga: así la compilación (Maven, JDK) no consume recursos del VPS.
name: Imagen del servidor
on:
  push:
    branches: [main]
    paths: ['servidor/**', 'evaluador-java/**', 'Dockerfile', '*/actividad.js', '*/codigo/**', '.github/workflows/imagen.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/juanestebane926/actividades-recuperacion:latest
            ghcr.io/juanestebane926/actividades-recuperacion:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
