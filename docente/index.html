<meta name="color-scheme" content="light dark">
<title>Panel docente · Recuperación</title>
<link rel="stylesheet" href="../assets/vendor/basecoat-1.1.0.min.css">

<style>
  .tablero { max-width: 1400px; margin: 0 auto; padding: 20px 20px 40px; }
  .cab-panel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 16px 0; }
  .cab-panel .marca { flex: 1; }
  .resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .resumen .card { gap: 6px; padding: 14px 16px; }
  .resumen .etq { display: flex; align-items: center; justify-content: space-between; color: var(--muted-foreground); font-size: 13px; font-weight: 500; }
  .resumen .num { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filtros .input { width: 260px; } .filtros .select { width: auto; }
  .filtros .cuenta { color: var(--muted-foreground); font-size: 13px; margin-left: auto; }
  .tabla-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
  table.lista { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  table.lista th, table.lista td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  table.lista tr:last-child td { border-bottom: none; }
  table.lista th { background: var(--muted); color: var(--muted-foreground); font-weight: 500; font-size: 12.5px; position: sticky; top: 0; }
  table.lista th[data-col] { cursor: pointer; user-select: none; }
  table.lista th[data-col]:hover { color: var(--foreground); }
  table.lista th .ico { width: 13px; height: 13px; margin-left: 3px; }
  table.lista tr.fila:hover td { background: var(--muted); cursor: pointer; }
  .pp { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 600; margin-right: 3px; border: 1px solid var(--border); color: var(--muted-foreground); }
  .pp.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  .pp.medio { background: var(--aviso-bg); color: var(--aviso); border-color: var(--aviso); }
  .nota { font-weight: 700; font-variant-numeric: tabular-nums; }
  .nota.ap { color: var(--ok); } .nota.rep { color: var(--mal); }
  dialog#dialogo { border: 1px solid var(--border); border-radius: 12px; padding: 0; width: min(1150px, 96vw); max-height: 92vh; background: var(--card); color: var(--foreground); margin: auto; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
  dialog#dialogo::backdrop { background: rgba(10, 10, 15, .55); }
  .det { padding: 20px 24px; overflow: auto; max-height: 92vh; display: grid; gap: 14px; }
  .det h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .det h3 { margin: 6px 0 0; font-size: 14.5px; font-weight: 600; }
  .det .marco-tabla { margin: 0; }
  .det pre.codigo { background: var(--codigo-bg); color: var(--codigo-texto); padding: 12px 14px; border-radius: 8px; font-size: 12.5px; overflow: auto; max-height: 420px; margin: 0; }
  .pestanas-doc { display: flex; gap: 4px; flex-wrap: wrap; }
  .pestanas-doc .btn { font-family: var(--mono); font-weight: 400; }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dialogo"><div class="det" id="detalle"></div></dialog>
<script defer src="../assets/config.js?v=32"></script>
<script defer src="../assets/iconos.js?v=32"></script>
<script defer src="panel.js?v=32"></script>
</body>
</html>
