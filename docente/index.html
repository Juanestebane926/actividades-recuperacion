<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
<title>Panel docente · Recuperación</title>
<link rel="stylesheet" href="../assets/motor.css?v=20">
<style>
  .panel { max-width: 1400px; margin: 0 auto; padding: 14px 16px 40px; }
  .cab-panel { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .cab-panel h1 { margin: 0; font-size: 22px; flex: 1; }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .filtros input, .filtros select { font: inherit; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--borde); background: var(--panel); color: var(--texto); }
  .tabla-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); }
  table.lista { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  table.lista th, table.lista td { padding: 6px 9px; border-bottom: 1px solid var(--borde); text-align: left; white-space: nowrap; }
  table.lista th { background: var(--panel2); position: sticky; top: 0; cursor: pointer; user-select: none; }
  table.lista tr.fila:hover td { background: var(--panel2); cursor: pointer; }
  .pp { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; font-size: 11px; font-weight: 700; margin-right: 2px; border: 1px solid var(--borde); color: var(--suave); }
  .pp.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  .pp.medio { background: var(--aviso-bg); color: var(--aviso); border-color: var(--aviso); }
  .nota { font-weight: 800; }
  .nota.ap { color: var(--ok); } .nota.rep { color: var(--mal); }
  .resumen { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .resumen .tarjeta { margin: 0; padding: 10px 16px; min-width: 150px; }
  .resumen .num { font-size: 26px; font-weight: 800; }
  dialog { border: 1px solid var(--borde); border-radius: 12px; padding: 0; width: min(1150px, 96vw); max-height: 92vh; background: var(--panel); color: var(--texto); }
  dialog::backdrop { background: rgba(10, 15, 30, .55); }
  .det { padding: 16px 20px; overflow: auto; max-height: 92vh; }
  .det h2 { margin: 0; }
  .det pre.codigo { background: var(--codigo-bg); color: #e8eef2; padding: 10px 12px; border-radius: 8px; font-size: 12.5px; overflow: auto; max-height: 420px; }
  .pestanas-doc { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
  .pestanas-doc button { border: 1px solid var(--borde); background: var(--panel2); border-radius: 7px; padding: 4px 10px; font-family: var(--mono); font-size: 12.5px; color: var(--texto); }
  .pestanas-doc button.activa { background: var(--primario); color: #fff; border-color: var(--primario); }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dialogo"><div class="det" id="detalle"></div></dialog>
<script src="../assets/config.js?v=21"></script>
<script src="panel.js?v=21"></script>
</body>
</html>
